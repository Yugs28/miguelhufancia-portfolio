<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miguel Hufancia — Portfolio</title>
  <meta
    name="description"
    content="Portfolio of Miguel Hufancia — IT student and designer."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-body">
  <button class="theme-toggle" id="themeToggle" aria-label="Switch color theme">
    <span class="theme-icon sun">☀</span>
    <span class="theme-icon moon">☾</span>
  </button>

  <main class="page home-page">
    <section class="hero" aria-labelledby="heroName">
      <div class="profile-photo-wrap">
        <img
          id="profileImage"
          class="profile-photo"
          src=""
          alt="Miguel Hufancia"
          hidden
        >
        <div id="profileInitials" class="profile-initials" aria-hidden="true">
          MH
        </div>
      </div>

      <p class="hero-kicker">IT student &amp; visual designer</p>
      <h1 class="hero-name" id="heroName">Miguel Hufancia</h1>
      <p class="hero-lede" id="heroTagline"></p>

      <nav class="home-buttons" aria-label="Portfolio sections">
        <a href="student.html" class="home-btn">
          <span class="home-btn-title">Student</span>
          <span class="home-btn-sub">Timeline, skills &amp; certificates</span>
        </a>

        <a href="designer.html" class="home-btn">
          <span class="home-btn-title">Designer</span>
          <span class="home-btn-sub">Skills, projects &amp; creative work</span>
        </a>
      </nav>

      <div class="home-contact" aria-label="Contact links">
        <a
          id="emailLink"
          class="contact-link"
          href="#"
          aria-label="Email Miguel"
          title="Email"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13Zm2 .32v.38L12 11l7-4.8v-.38A.5.5 0 0 0 18.5 5h-13a.5.5 0 0 0-.5.82ZM19 8.57l-6.46 4.18a1 1 0 0 1-1.08 0L5 8.57v9.93c0 .28.22.5.5.5h13a.5.5 0 0 0 .5-.5V8.57Z"/>
          </svg>
        </a>

        <a
          id="linkedinLink"
          class="contact-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Miguel's LinkedIn profile"
          title="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.94 8.5A1.94 1.94 0 1 0 6.94 4.62 1.94 1.94 0 0 0 6.94 8.5ZM5.25 9.94h3.38V20H5.25V9.94ZM10.75 9.94H14v1.38h.05c.45-.86 1.56-1.76 3.2-1.76 3.43 0 4.07 2.26 4.07 5.2V20h-3.37v-4.65c0-1.1-.02-2.53-1.54-2.53-1.54 0-1.78 1.2-1.78 2.45V20h-3.38V9.94Z"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
